# nginx do site VIGIA-Dengue. Copiado pelo Dockerfile para
# /etc/nginx/conf.d/default.conf.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    charset_types text/css application/javascript application/json text/csv;

    # O painel.json tem ~350 KB; comprimido, cai para perto de 80 KB.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json text/csv image/svg+xml;

    # Os dados mudam todo dia e a pagina a cada publicacao. "no-cache" nao
    # proibe o cache: obriga o navegador a confirmar com o servidor, que
    # responde 304 quando nada mudou. Assim ninguem ve o JavaScript novo com
    # o JSON velho, ou o contrario.
    expires -1;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Estado corrente do alerta, para quem quiser consumir de fora (um script,
    # um painel de parede). CORS aberto: e dado publico.
    location = /dados/alerta.json {
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # O mime.types do nginx nao conhece .csv; sem isto o download do
    # dicionario sairia como binario generico.
    location ~ \.csv$ {
        default_type text/csv;
    }

    # Healthcheck do container.
    location = /saude {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
