name: Publicar painel

# O site vigia.guimm.site e uma pagina estatica servida pelo nginx. A imagem e
# construida aqui, e nao no repositorio do site, porque e aqui que o codigo e
# os dados vivem: o build gera o painel.json a partir do que esta versionado
# (src/vigia/exportar_site.py), e o que esta no ar acompanha a pesquisa sem
# copia manual.
#
# A lista de caminhos e a mesma do Dockerfile: todo arquivo que a imagem
# copia precisa aparecer aqui, no Dockerfile e no .dockerignore.
on:
  push:
    branches: [master, main]
    paths:
      - "site/index.html"
      - "site/estilo.css"
      - "site/app.js"
      - "src/vigia/exportar_site.py"
      - "nginx.conf"
      - "dados/processado/painel.csv"
      - "dados/externo/malha_ride_df.geojson"
      - "dados/externo/malha_ras_df.geojson"
      - "dados/externo/vulnerabilidade_ras.csv"
      - "dados/externo/setores_df.geojson"
      - "saidas/desempenho_modelos.csv"
      - "saidas/alerta.json"
      - "saidas/alarmes.json"
      - "saidas/clima_futuro.json"
      - "docs/dicionario_de_dados.csv"
      - "docs/glossario.csv"
      - "Dockerfile"
      - ".dockerignore"
      - "requirements-site.txt"
      - ".github/workflows/publicar-painel.yml"
  workflow_dispatch:

concurrency:
  group: publicar-painel
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Entrar no registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir e publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # A tag com o SHA permite voltar a uma versão exata do painel;
          # a `latest` é a que o compose do site usa.
          # Pacote próprio deste repositório. O nome `guimm-vigia` pertence ao
          # repositório do site, e o token daqui não pode escrever nele:
          # pacotes do GHCR ficam vinculados a quem os criou.
          tags: |
            ghcr.io/${{ github.repository_owner }}/vigia-dengue:latest
            ghcr.io/${{ github.repository_owner }}/vigia-dengue:${{ github.sha }}

  avisar-portainer:
    needs: construir
    runs-on: ubuntu-latest
    steps:
      - name: Chamar o webhook do stack
        env:
          WEBHOOK: ${{ secrets.PORTAINER_WEBHOOK }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "PORTAINER_WEBHOOK nao configurado; pulando."
            exit 0
          fi
          codigo=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$WEBHOOK")
          echo "Portainer respondeu HTTP $codigo"
          case "$codigo" in
            2*) echo "Republicacao disparada." ;;
            *)  echo "::error::O Portainer nao aceitou o webhook (HTTP $codigo)."; exit 1 ;;
          esac
