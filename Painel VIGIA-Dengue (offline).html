document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);

    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.

      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

eight: 400;\n  font-display: swap;\n  src: url(\"92470180-ad3c-40ca-a6e0-6e3828f17f15\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Barlow Condensed';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"cb07e9e9-77d4-4f74-987c-17ef7151a436\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Barlow Condensed';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"2ba9e1d6-4a40-44c7-b477-63b87a8024c2\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Barlow Condensed';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"be2b4db7-165f-43c7-94c6-8395fd57e6d0\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Barlow Condensed';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"c21250d2-8cac-4bc6-a2bf-d5def7fe86ea\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Barlow Condensed';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"8941b6f5-91fb-408e-9bca-d58bc61d17d1\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #f2f2f3;\n  --color-surface: #e9e9ea;\n  --color-text: #1d1f20;\n  --color-accent: #5980a6;\n  --color-accent-2: #728fab;\n  --color-divider: color-mix(in srgb, #1d1f20 16%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f5f5f8;\n  --color-neutral-200: #e7e7ea;\n  --color-neutral-300: #d4d4d7;\n  --color-neutral-400: #b7b7ba;\n  --color-neutral-500: #98989b;\n  --color-neutral-600: #7a7a7d;\n  --color-neutral-700: #5d5d60;\n  --color-neutral-800: #424244;\n  --color-neutral-900: #2b2b2d;\n\n  --color-accent-100: #eef6ff;\n  --color-accent-200: #d6ebff;\n  --color-accent-300: #b5d9fd;\n  --color-accent-400: #94bce3;\n  --color-accent-500: #749dc4;\n  --color-accent-600: #597ea3;\n  --color-accent-700: #416180;\n  --color-accent-800: #2c455d;\n  --color-accent-900: #1d2d3d;\n\n  --color-accent-2-100: #eef6ff;\n  --color-accent-2-200: #d6ebff;\n  --color-accent-2-300: #bdd8f2;\n  --color-accent-2-400: #9ebbd8;\n  --color-accent-2-500: #7e9cb8;\n  --color-accent-2-600: #627d98;\n  --color-accent-2-700: #486077;\n  --color-accent-2-800: #314457;\n  --color-accent-2-900: #1f2d3a;\n\n  --font-heading: \"Barlow Condensed\", system-ui, sans-serif;\n  --font-heading-weight: 600;\n  --font-body: \"Barlow\", system-ui, sans-serif;\n\n  --space-1: 3.4px;\n  --space-2: 6.8px;\n  --space-3: 10.2px;\n  --space-4: 13.6px;\n  --space-6: 20.4px;\n  --space-8: 27.2px;\n\n  --radius-sm: 2px;\n  --radius-md: 4px;\n  --radius-lg: 7px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2b2b2d 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2b2b2d 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2b2b2d 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.blueprint {\n  position: relative;\n  border: 1px solid var(--color-divider);\n  border-radius: 0;\n}\n/* The overlay image treatments (halftone, duotone) clip their overlay\n   (overflow:hidden); a blueprint wrapper draws its registration marks\n   outside the box, so when both classes share a wrapper the frame must\n   win. */\n.blueprint.halftone, .blueprint.plate, .blueprint.duotone { overflow: visible; }\n.blueprint > .corner {\n  position: absolute; width: 11px; height: 11px;\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.blueprint > .corner::before, .blueprint > .corner::after {\n  content: \"\"; position: absolute; background: currentColor;\n}\n.blueprint > .corner::before { left: 5px; top: 0; width: 1px; height: 100%; }\n.blueprint > .corner::after  { top: 5px; left: 0; width: 100%; height: 1px; }\n.blueprint > .corner.tl { top: -6px; left: -6px; }\n.blueprint > .corner.tr { top: -6px; right: -6px; }\n.blueprint > .corner.bl { bottom: -6px; left: -6px; }\n.blueprint > .corner.br { bottom: -6px; right: -6px; }\n\n.duotone{position:relative;overflow:hidden}\n.duotone::after{content:\"\";position:absolute;inset:0;pointer-events:none;\n  background:var(--color-accent);mix-blend-mode:color}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n/* — blueprint frame: components are wireframe objects (see .blueprint\n     and .corner above) — square, transparent, hairline-bordered — */\n.card, .btn, .input, .tag, .seg, .dialog { border-radius: 0; }\n.card, .dialog { background: transparent; border: 1px solid var(--color-divider); }\n.btn { border: 1px solid var(--color-divider); }\n.btn-primary { border-color: var(--color-accent); }\n.btn-ghost { border-color: transparent; }\n\n<\u002Fstyle>\n<script src=\"69b20685-e01a-47bd-95fb-770a071155f0\"><\u002Fscript>\n<script src=\"a21ee280-1cba-4038-ab26-da0c7e2c4d54\"><\u002Fscript>\n<script src=\"5f79894c-a5b9-47cc-9337-e01095e24464\"><\u002Fscript>\n<style>\n  html, body { height: 100%; }\n  body { margin: 0; overflow: hidden; }\n  .vg-rail-item:hover { background: color-mix(in srgb, var(--color-text) 6%, transparent); }\n  .vg-scroll { overflow-y: auto; scrollbar-width: thin; }\n  .vg-num { font-variant-numeric: tabular-nums; }\n  input[type=range] { accent-color: var(--color-accent); }\n<\u002Fstyle>\n\n<\u002Fhelmet>\n\n<div style=\"height:100vh;display:grid;grid-template-rows:auto 1fr;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body)\">\n\n  <header style=\"display:flex;align-items:center;gap:20px;padding:12px 22px;border-bottom:1px solid var(--color-divider);background:var(--color-bg)\">\n    <div style=\"display:flex;align-items:baseline;gap:12px\">\n      <span style=\"font-family:var(--font-heading);font-weight:600;font-size:22px;letter-spacing:-0.01em\">VIGIA‑DENGUE<\u002Fspan>\n      <span style=\"font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:color-mix(in srgb, var(--color-text) 50%, transparent)\">Alerta precoce · DF + Entorno<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"margin-left:auto;display:flex;align-items:center;gap:26px\">\n      <div style=\"display:flex;flex-direction:column;gap:2px;min-width:230px\">\n        <div style=\"display:flex;justify-content:space-between;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:color-mix(in srgb, var(--color-text) 55%, transparent)\">\n          <span>Semana epidemiológica<\u002Fspan>\n          <span class=\"vg-num\" style=\"color:var(--color-accent-700);font-weight:500\">{{ semanaRotulo }}<\u002Fspan>\n        <\u002Fdiv>\n        <input type=\"range\" min=\"0\" max=\"{{ semanaMax }}\" value=\"{{ semanaIndice }}\" sc-camel-on-change=\"{{ aoMudarSemana }}\" style=\"width:100%;height:16px\">\n      <\u002Fdiv>\n      <div style=\"text-align:right;line-height:1.25\">\n        <div class=\"vg-num\" style=\"font-family:var(--font-heading);font-size:20px\">{{ dataSemana }}<\u002Fdiv>\n        <div style=\"font-size:11px;color:color-mix(in srgb, var(--color-text) 50%, transparent)\">início da semana<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <div style=\"display:grid;grid-template-columns:238px 1fr;min-height:0\">\n\n    <nav class=\"vg-scroll\" style=\"border-right:1px solid var(--color-divider);display:flex;flex-direction:column;padding:14px 0\">\n      <sc-for list=\"{{ abas }}\" as=\"aba\" hint-placeholder-count=\"6\">\n        <button class=\"vg-rail-item\" sc-camel-on-click=\"{{ aba.ir }}\" style=\"{{ aba.estilo }}\">\n          <span class=\"vg-num\" style=\"font-size:11px;opacity:0.55;letter-spacing:0.06em\">{{ aba.num }}<\u002Fspan>\n          <span style=\"font-family:var(--font-heading);font-weight:600;font-size:15px;text-align:left;line-height:1.15\">{{ aba.rotulo }}<\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fsc-for>\n\n      <div style=\"margin:20px 18px 0;padding-top:18px;border-top:1px solid var(--color-divider);display:flex;flex-direction:column;gap:16px\">\n        <div class=\"field\">\n          <label>Município em detalhe<\u002Flabel>\n          <sc-raw-select class=\"input\" value=\"{{ municipioSel }}\" sc-camel-on-change=\"{{ aoMudarMunicipio }}\">\n            <sc-for list=\"{{ opcoesMunicipio }}\" as=\"op\" hint-placeholder-count=\"4\">\n              <option value=\"{{ op.valor }}\">{{ op.rotulo }}<\u002Foption>\n            <\u002Fsc-for>\n          <\u002Fsc-raw-select>\n        <\u002Fdiv>\n        <div class=\"field\">\n          <label>Limiar do alerta · <span class=\"vg-num\">{{ limiarRotulo }}<\u002Fspan><\u002Flabel>\n          <input type=\"range\" min=\"5\" max=\"95\" step=\"5\" value=\"{{ limiarPct }}\" sc-camel-on-change=\"{{ aoMudarLimiar }}\" style=\"width:100%\">\n        <\u002Fdiv>\n        <label class=\"radio\" style=\"align-items:flex-start;gap:8px;font-size:12px;line-height:1.35\">\n          <input type=\"checkbox\" checked=\"{{ sinalizar }}\" sc-camel-on-change=\"{{ aoMudarSinalizar }}\">\n          <span class=\"dot\" style=\"margin-top:2px;border-radius:0\"><\u002Fspan>\n          <span>Sinalizar semanas com notificação incompleta<\u002Fspan>\n        <\u002Flabel>\n      <\u002Fdiv>\n\n      <div style=\"margin:auto 18px 4px;padding-top:18px;font-size:11px;line-height:1.45;color:color-mix(in srgb, var(--color-text) 50%, transparent)\">\n        O alerta projeta o risco <strong>4 semanas à frente<\u002Fstrong>. Casos estimados corrigem o atraso de notificação.\n      <\u002Fdiv>\n    <\u002Fnav>\n\n    <main class=\"vg-scroll\" style=\"min-width:0;padding:22px 26px 40px\">\n\n      <sc-if value=\"{{ carregando }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"height:60vh;display:grid;place-items:center;color:color-mix(in srgb, var(--color-text) 45%, transparent);font-family:var(--font-heading);font-size:18px;letter-spacing:0.08em;text-transform:uppercase\">Carregando base analítica…<\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ─────────────── 01 PANORAMA ─────────────── -->\n      <sc-if value=\"{{ ehPanorama }}\" hint-placeholder-val=\"{{ false }}\">\n        <section data-screen-label=\"01 Panorama\">\n          <div style=\"display:flex;align-items:baseline;gap:14px;margin-bottom:16px\">\n            <h2 style=\"margin:0;font-size:30px\">Brasília<\u002Fh2>\n            <span style=\"font-size:12px;letter-spacing:0.1em;text-transform:uppercase;color:color-mix(in srgb, var(--color-text) 50%, transparent)\">semana {{ semanaRotulo }}<\u002Fspan>\n          <\u002Fdiv>\n\n          <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:18px\">\n            <sc-for list=\"{{ metricas }}\" as=\"m\" hint-placeholder-count=\"4\">\n              <div class=\"blueprint\" style=\"padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;min-height:118px\">\n                <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n                <div style=\"font-size:10px;letter-spacing:0.11em;text-transform:uppercase;color:var(--color-accent-700)\">{{ m.rotulo }}<\u002Fdiv>\n                <div class=\"vg-num\" style=\"font-family:var(--font-heading);font-weight:600;font-size:40px;line-height:1;letter-spacing:-0.02em;color:{{ m.cor }}\">{{ m.valor }}<\u002Fdiv>\n                <div style=\"margin-top:auto;font-size:11px;color:color-mix(in srgb, var(--color-text) 55%, transparent)\">{{ m.nota }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ emAlerta }}\" hint-placeholder-val=\"{{ false }}\">\n            <div class=\"blueprint\" style=\"margin-top:20px;padding:16px 20px;background:var(--color-accent-900);color:#f2f2f3;display:flex;gap:18px;align-items:center\">\n              <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n              <span style=\"font-family:var(--font-heading);font-weight:600;font-size:13px;letter-spacing:0.16em;text-transform:uppercase;padding:5px 12px;border:1px solid rgba(242,242,243,0.5);white-space:nowrap\">Em alerta<\u002Fspan>\n              <span style=\"font-size:14px;line-height:1.45\">{{ textoAlerta }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ avisoProvisorio }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:14px;padding:11px 16px;border-left:2px solid var(--color-accent);background:var(--color-accent-100);font-size:13px\">{{ textoProvisorio }}<\u002Fdiv>\n          <\u002Fsc-if>\n\n          <div style=\"display:grid;grid-template-columns:1.55fr 1fr;gap:26px;margin-top:30px;align-items:start\">\n            <div>\n              <h4 style=\"margin:0 0 4px;font-size:19px\">Casos estimados em Brasília<\u002Fh4>\n              <p style=\"font-size:12px;color:color-mix(in srgb, var(--color-text) 55%, transparent);margin-bottom:10px\">Últimas 156 semanas. Faixa clara: intervalo do nowcasting.<\u002Fp>\n              <svg sc-camel-view-box=\"0 0 720 240\" style=\"width:100%;height:auto;display:block;overflow:visible\">\n                <g stroke=\"var(--color-divider)\" stroke-width=\"1\">\n                  <sc-for list=\"{{ mini.grade }}\" as=\"g\" hint-placeholder-count=\"4\">\n                    <line x1=\"0\" y1=\"{{ g.y }}\" x2=\"720\" y2=\"{{ g.y }}\"><\u002Fline>\n                  <\u002Fsc-for>\n                <\u002Fg>\n                <path d=\"{{ mini.banda }}\" fill=\"var(--color-accent-200)\" opacity=\"0.75\"><\u002Fpath>\n                <path d=\"{{ mini.est }}\" fill=\"none\" stroke=\"var(--color-accent-800)\" stroke-width=\"1.8\"><\u002Fpath>\n                <path d=\"{{ mini.not }}\" fill=\"none\" stroke=\"var(--color-neutral-600)\" stroke-width=\"1\" stroke-dasharray=\"3 3\"><\u002Fpath>\n                <line x1=\"{{ mini.marcador }}\" y1=\"0\" x2=\"{{ mini.marcador }}\" y2=\"240\" stroke=\"var(--color-accent)\" stroke-width=\"1\"><\u002Fline>\n                <g fill=\"color-mix(in srgb, var(--color-text) 55%, transparent)\" font-size=\"10\" font-family=\"Barlow\">\n                  <sc-for list=\"{{ mini.rotulosX }}\" as=\"t\" hint-placeholder-count=\"4\">\n                    <text x=\"{{ t.x }}\" y=\"256\" text-anchor=\"middle\">{{ t.rotulo }}<\u002Ftext>\n                  <\u002Fsc-for>\n                  <sc-for list=\"{{ mini.grade }}\" as=\"g\" hint-placeholder-count=\"4\">\n                    <text x=\"-8\" y=\"{{ g.ty }}\" text-anchor=\"end\">{{ g.rotulo }}<\u002Ftext>\n                  <\u002Fsc-for>\n                <\u002Fg>\n              <\u002Fsvg>\n            <\u002Fdiv>\n\n            <div class=\"blueprint\" style=\"padding:18px 20px\">\n              <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n              <div style=\"font-size:10px;letter-spacing:0.11em;text-transform:uppercase;color:var(--color-accent-700);margin-bottom:12px\">Contexto — Entorno (RIDE)<\u002Fdiv>\n              <sc-for list=\"{{ entorno }}\" as=\"e\" hint-placeholder-count=\"3\">\n                <div style=\"display:flex;justify-content:space-between;align-items:baseline;padding:9px 0;border-bottom:1px solid color-mix(in srgb, var(--color-text) 8%, transparent)\">\n                  <span style=\"font-size:13px\">{{ e.rotulo }}<\u002Fspan>\n                  <span class=\"vg-num\" style=\"font-family:var(--font-heading);font-weight:600;font-size:22px\">{{ e.valor }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <p style=\"margin:14px 0 0;font-size:12px;line-height:1.5;color:color-mix(in srgb, var(--color-text) 60%, transparent)\">O Entorno acompanha Brasília pelo pendularismo diário: a circulação viral atravessa a fronteira do DF nos dois sentidos.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsection>\n      <\u002Fsc-if>\n\n      <!-- ─────────────── 02 MAPA 3D ─────────────── -->\n      <sc-if value=\"{{ ehMapa }}\" hint-placeholder-val=\"{{ false }}\">\n        <section data-screen-label=\"02 Mapa de risco 3D\" style=\"display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;align-items:start\">\n          <div style=\"min-width:0\">\n            <div style=\"display:flex;align-items:baseline;gap:14px;margin-bottom:10px;flex-wrap:wrap\">\n              <h2 style=\"margin:0;font-size:30px;white-space:nowrap\">Mapa de risco<\u002Fh2>\n              <span style=\"font-size:12px;letter-spacing:0.1em;text-transform:uppercase;color:color-mix(in srgb, var(--color-text) 50%, transparent)\">{{ subtituloMapa }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap\">\n              <span class=\"seg\" style=\"flex:none\">\n                <sc-for list=\"{{ niveisMapa }}\" as=\"n\" hint-placeholder-count=\"2\">\n                  <label class=\"seg-opt\" style=\"white-space:nowrap\"><input type=\"radio\" name=\"nivelmapa\" checked=\"{{ n.ativo }}\" sc-camel-on-change=\"{{ n.ir }}\"><span>{{ n.rotulo }}<\u002Fspan><\u002Flabel>\n                <\u002Fsc-for>\n              <\u002Fspan>\n              <sc-if value=\"{{ ehNivelRas }}\" hint-placeholder-val=\"{{ true }}\">\n                <span class=\"seg\" style=\"flex:none\">\n                  <sc-for list=\"{{ indicadoresMapa }}\" as=\"i\" hint-placeholder-count=\"2\">\n                    <label class=\"seg-opt\" style=\"white-space:nowrap\"><input type=\"radio\" name=\"indicmapa\" checked=\"{{ i.ativo }}\" sc-camel-on-change=\"{{ i.ir }}\"><span>{{ i.rotulo }}<\u002Fspan><\u002Flabel>\n                  <\u002Fsc-for>\n                <\u002Fspan>\n              <\u002Fsc-if>\n              <span style=\"margin-left:auto;display:flex;align-items:center;gap:6px\">\n                <button class=\"btn btn-secondary btn-icon\" sc-camel-on-click=\"{{ zoomMenos }}\" title=\"Afastar\">−<\u002Fbutton>\n                <button class=\"btn btn-secondary btn-icon\" sc-camel-on-click=\"{{ zoomMais }}\" title=\"Aproximar\">+<\u002Fbutton>\n                <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ enquadrar }}\">Enquadrar<\u002Fbutton>\n              <\u002Fspan>\n            <\u002Fdiv>\n            <div class=\"blueprint\" style=\"position:relative;height:560px;background:linear-gradient(180deg,var(--color-neutral-100),var(--color-bg))\">\n              <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n              <div ref=\"{{ refMapa }}\" style=\"position:absolute;inset:0\"><\u002Fdiv>\n              <div style=\"position:absolute;left:14px;bottom:12px;right:14px;font-size:11px;line-height:1.4;color:color-mix(in srgb, var(--color-text) 50%, transparent);pointer-events:none\">{{ notaMapa }}<\u002Fdiv>\n              <div style=\"position:absolute;right:14px;top:12px;font-size:10px;letter-spacing:0.09em;text-transform:uppercase;color:color-mix(in srgb, var(--color-text) 40%, transparent);pointer-events:none\">arraste para girar · scroll para aproximar<\u002Fdiv>\n              <sc-if value=\"{{ dica.visivel }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"{{ dica.estilo }}\">\n                  <div style=\"font-family:var(--font-heading);font-weight:600;font-size:16px\">{{ dica.nome }}<\u002Fdiv>\n                  <div class=\"vg-num\" style=\"font-size:12px;line-height:1.5;margin-top:3px\">{{ dica.linha1 }}<\u002Fdiv>\n                  <div class=\"vg-num\" style=\"font-size:12px;line-height:1.5\">{{ dica.linha2 }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:22px;margin-top:14px;flex-wrap:wrap\">\n              <sc-for list=\"{{ legenda }}\" as=\"l\" hint-placeholder-count=\"4\">\n                <span style=\"display:inline-flex;align-items:center;gap:8px;font-size:12px\">\n                  <i style=\"width:14px;height:14px;display:block;background:{{ l.cor }};border:1px solid color-mix(in srgb, var(--color-text) 30%, transparent)\"><\u002Fi>\n                  <span>{{ l.rotulo }}<\u002Fspan>\n                  <span class=\"vg-num\" style=\"color:color-mix(in srgb, var(--color-text) 50%, transparent)\">{{ l.n }}<\u002Fspan>\n                <\u002Fspan>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display:flex;flex-direction:column;gap:22px\">\n            <div class=\"blueprint\" style=\"padding:16px 18px\">\n              <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n              <div style=\"font-size:10px;letter-spacing:0.11em;text-transform:uppercase;color:var(--color-accent-700);margin-bottom:10px\">{{ tituloTopo }}<\u002Fdiv>\n              <sc-for list=\"{{ topo }}\" as=\"t\" hint-placeholder-count=\"6\">\n                <button sc-camel-on-click=\"{{ t.ir }}\" style=\"{{ t.estilo }}\">\n                  <span style=\"font-size:13px;text-align:left\">{{ t.nome }}<\u002Fspan>\n                  <span style=\"margin-left:auto;display:flex;align-items:center;gap:9px\">\n                    <i style=\"display:block;width:52px;height:6px;background:var(--color-neutral-300)\"><i style=\"display:block;height:6px;width:{{ t.barra }};background:{{ t.cor }}\"><\u002Fi><\u002Fi>\n                    <span class=\"vg-num\" style=\"font-size:13px;font-weight:500;min-width:34px;text-align:right\">{{ t.prob }}<\u002Fspan>\n                  <\u002Fspan>\n                <\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <div class=\"blueprint\" style=\"padding:16px 18px\">\n              <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n              <div style=\"font-size:10px;letter-spacing:0.11em;text-transform:uppercase;color:var(--color-accent-700);margin-bottom:10px\">{{ tituloDetalhe }}<\u002Fdiv>\n              <div style=\"font-family:var(--font-heading);font-weight:600;font-size:24px;line-height:1.1\">{{ detalhe.nome }}<\u002Fdiv>\n              <sc-for list=\"{{ detalhe.linhas }}\" as=\"d\" hint-placeholder-count=\"5\">\n                <div style=\"display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px solid color-mix(in srgb, var(--color-text) 8%, transparent)\">\n olor:var(--color-accent-800);font-weight:500\">Brasília<\u002Fspan> em traço cheio, <span style=\"color:var(--color-neutral-600);font-weight:500\">Entorno<\u002Fspan> pontilhado.<\u002Fp>\n            <svg sc-camel-view-box=\"0 0 900 220\" style=\"width:100%;height:auto;display:block;overflow:visible\">\n              <g stroke=\"var(--color-divider)\" stroke-width=\"1\">\n                <sc-for list=\"{{ g3.grade }}\" as=\"g\" hint-placeholder-count=\"4\"><line x1=\"0\" y1=\"{{ g.y }}\" x2=\"900\" y2=\"{{ g.y }}\"><\u002Fline><\u002Fsc-for>\n              <\u002Fg>\n              <path d=\"{{ g3.entorno }}\" fill=\"none\" stroke=\"var(--color-neutral-600)\" stroke-width=\"1.4\" stroke-dasharray=\"4 3\"><\u002Fpath>\n              <path d=\"{{ g3.bsb }}\" fill=\"none\" stroke=\"var(--color-accent-800)\" stroke-width=\"2\"><\u002Fpath>\n              <line x1=\"{{ g3.marcador }}\" y1=\"0\" x2=\"{{ g3.marcador }}\" y2=\"220\" stroke=\"var(--color-accent)\" stroke-width=\"1\"><\u002Fline>\n              <g fill=\"color-mix(in srgb, var(--color-text) 55%, transparent)\" font-size=\"10\" font-family=\"Barlow\">\n                <sc-for list=\"{{ g3.rotulosX }}\" as=\"t\" hint-placeholder-count=\"5\"><text x=\"{{ t.x }}\" y=\"238\" text-anchor=\"middle\">{{ t.rotulo }}<\u002Ftext><\u002Fsc-for>\n                <sc-for list=\"{{ g3.grade }}\" as=\"g\" hint-placeholder-count=\"4\"><text x=\"-8\" y=\"{{ g.ty }}\" text-anchor=\"end\">{{ g.rotulo }}<\u002Ftext><\u002Fsc-for>\n              <\u002Fg>\n            <\u002Fsvg>\n          <\u002Fdiv>\n        <\u002Fsection>\n      <\u002Fsc-if>\n\n      <!-- ─────────────── 04 RANKING ─────────────── -->\n      <sc-if value=\"{{ ehRanking }}\" hint-placeholder-val=\"{{ false }}\">\n        <section data-screen-label=\"04 Ranking e relatório\">\n          <div style=\"display:flex;align-items:baseline;gap:14px;margin-bottom:6px\">\n            <h2 style=\"margin:0;font-size:30px\">Ranking e relatório<\u002Fh2>\n            <span                <sc-raw-td><span class=\"tag\" style=\"background:{{ r.corFundo }};color:{{ r.corTexto }}\">{{ r.risco }}<\u002Fspan><\u002Fsc-raw-td>\n                  <sc-raw-td class=\"vg-num\" style=\"text-align:right;font-weight:500\">{{ r.prob }}<\u002Fsc-raw-td>\n                  <sc-raw-td style=\"font-size:12px;color:color-mix(in srgb, var(--color-text) 60%, transparent)\">{{ r.fatores }}<\u002Fsc-raw-td>\n                <\u002Fsc-raw-tr>\n              <\u002Fsc-for>\n            <\u002Fsc-raw-tbody>\n          <\u002Fsc-raw-table>\n        <\u002Fsection>\n      <\u002Fsc-if>\n\n      <!-- ─────────────── 05 DESEMPENHO ─────────────── -->\n      <sc-if value=\"{{ ehModelo }}\" hint-placeholder-val=\"{{ false }}\">\n        <section data-screen-label=\"05 Desempenho do modelo\">\n          <h2 style=\"margin:0 0 4px;font-size:30px\">Desempenho do modelo<\u002Fh2>\n          <p style=\"font-size:13px;color:color-mix(in srgb, var(--color-text) 60%, transparent);max-width:70ch;margin-bottom:22px\">Validação temporal em janela expansiva: cada ano é previsto por um modelo treinado apenas com os anos anteriores. Desfecho — risco alto ou muito alto 4 semanas à frente. Média de 2019 a 2025.<\u002Fp>\n\n          <sc-raw-table class=\"table\" style=\"margin-bottom:34px\">\n            <sc-raw-thead><sc-raw-tr>\n              <sc-raw-th>Modelo<\u002Fsc-raw-th><sc-raw-th style=\"text-align:right\">Sensibilidade<\u002Fsc-raw-th><sc-raw-th style=\"text-align:right\">Especificidade<\u002Fsc-raw-th>\n              <sc-raw-th style=\"text-align:right\">VPP<\u002Fsc-raw-th><sc-raw-th style=\"text-align:right\">AUC<\u002Fsc-raw-th><sc-raw-th style=\"text-align:right\">AUPRC<\u002Fsc-raw-th><sc-raw-th style=\"text-align:right\">Brier<\u002Fsc-raw-th>\n            <\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n            <sc-raw-tbody>\n              <sc-for list=\"{{ medias }}\" as=\"m\" hint-placeholder-count=\"3\">\n                <sc-raw-tr>\n                  <sc-raw-td style=\"font-weight:{{ m.peso }}\">{{ m.modelo }}<\u002Fsc-raw-td>\n                  <sc-for list=\"{{ m.cels }}\" as=\"c\" hint-placeholder-count=\"6\">\n                    <sc-raw-td class=\"vg-num\" style=\"text-align:right;color:{{ c.cor }};font-weight:{{ c.peso }}\">{{ c.v }}<\u002Fsc-raw-td>\n                  <\u002Fsc-for>\n                <\u002Fsc-raw-tr>\n              <\u002Fsc-for>\n            <\u002Fsc-raw-tbody>\n          <\u002Fsc-raw-table>\n\n          <div style=\"display:grid;grid-template-columns:1.3fr 1fr;gap:30px;align-items:start\">\n            <div>\n              <h4 style=\"margin:0 0 2px;font-size:18px\">AUC por ano avaliado<\u002Fh4>\n              <p style=\"font-size:12px;color:color-mix(in srgb, var(--color-text) 55%, transparent);margin-bottom:12px\">A vantagem do LightGBM cresce nos anos epidêmicos.<\u002Fp>\n              <svg sc-camel-view-box=\"0 0 600 250\" style=\"width:100%;height:auto;display:block;overflow:visible\">\n                <g stroke=\"var(--color-divider)\" stroke-width=\"1\">\n                  <sc-for list=\"{{ auc.grade }}\" as=\"g\" hint-placeholder-count=\"4\"><line x1=\"0\" y1=\"{{ g.y }}\" x2=\"600\" y2=\"{{ g.y }}\"><\u002Fline><\u002Fsc-for>\n                <\u002Fg>\n                <sc-for list=\"{{ auc.linhas }}\" as=\"l\" hint-placeholder-count=\"3\">\n                  <path d=\"{{ l.d }}\" fill=\"none\" stroke=\"{{ l.cor }}\" stroke-width=\"{{ l.largura }}\" stroke-dasharray=\"{{ l.traco }}\"><\u002Fpath>\n                <\u002Fsc-for>\n                <g fill=\"color-mix(in srgb, var(--color-text) 55%, transparent)\" font-size=\"10\" font-family=\"Barlow\">\n                  <sc-for list=\"{{ auc.rotulosX }}\" as=\"t\" hint-placeholder-count=\"7\"><text x=\"{{ t.x }}\" y=\"268\" text-anchor=\"middle\">{{ t.rotulo }}<\u002Ftext><\u002Fsc-for>\n                  <sc-for list=\"{{ auc.grade }}\" as=\"g\" hint-placeholder-count=\"4\"><text x=\"-8\" y=\"{{ g.ty }}\" text-anchor=\"end\">{{ g.rotulo }}<\u002Ftext><\u002Fsc-for>\n                <\u002Fg>\n              <\u002Fsvg>\n              <div style=\"display:flex;gap:20px;margin-top:12px\">\n                <sc-for list=\"{{ auc.linhas }}\" as=\"l\" hint-placeholder-count=\"3\">\n                  <span style=\"display:inline-flex;align-items:center;gap:7px;font-size:12px\">\n                    <i style=\"width:18px;height:2px;display:block;background:{{ l.cor }}\"><\u002Fi><span>{{ l.nome }}<\u002Fspan>\n                  <\u002Fspan>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div>\n              <h4 style=\"margin:0 0 2px;font-size:18px\">Variáveis mais importantes<\u002Fh4>\n              <p style=\"font-size:12px;color:color-mix(in srgb, var(--color-text) 55%, transparent);margin-bottom:12px\">Ganho relativo no LightGBM (%).<\u002Fp>\n              <sc-for list=\"{{ importancia }}\" as=\"v\" hint-placeholder-count=\"12\">\n                <div style=\"display:grid;grid-template-columns:1fr 130px 42px;align-items:center;gap:10px;padding:3px 0\">\n                  <span style=\"font-size:12px;font-family:var(--font-heading);letter-spacing:0.01em\">{{ v.nome }}<\u002Fspan>\n                  <i style=\"display:block;height:9px;background:var(--color-neutral-200)\"><i style=\"display:block;height:9px;width:{{ v.barra }};background:var(--color-accent-600)\"><\u002Fi><\u002Fi>\n                  <span class=\"vg-num\" style=\"font-size:12px;text-align:right;color:color-mix(in srgb, var(--color-text) 60%, transparent)\">{{ v.pct }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsection>\n      <\u002Fsc-if>\n\n      <!-- ─────────────── 06 RAs ─────────────── -->\n      <sc-if value=\"{{ ehRas }}\" hint-placeholder-val=\"{{ false }}\">\n        <section data-screen-label=\"06 Brasília por RA\">\n          <div style=\"display:flex;align-items:baseline;gap:14px;margin-bottom:6px\">\n            <h2 style=\"margin:0;font-size:30px\">Brasília por Região Administrativa<\u002Fh2>\n            <span class=\"seg\" style=\"margin-left:auto\">\n              <sc-for list=\"{{ indicadores }}\" as=\"i\" hint-placeholder-count=\"2\">\n                <label class=\"seg-opt\"><input type=\"radio\" name=\"indic\" checked=\"{{ i.ativo }}\" sc-camel-on-change=\"{{ i.ir }}\"><span>{{ i.rotulo }}<\u002Fspan><\u002Flabel>\n              <\u002Fsc-for>\n            <\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"font-size:13px;color:color-mix(in srgb, var(--color-text) 60%, transparent);max-width:78ch;margin-bottom:18px\">As 31 Regiões Administrativas com geometria disponível. Brasília é um único município na malha do IBGE; esta camada mostra a divisão intraurbana que o dado municipal não alcança.<\u002Fp>\n\n          <div style=\"display:grid;grid-template-columns:1.2fr 1fr;gap:26px;align-items:start\">\n            <div class=\"blueprint\" style=\"padding:18px\">\n              <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n              <svg sc-camel-view-box=\"{{ ras.viewBox }}\" style=\"width:100%;height:auto;display:block\">\n                <sc-for list=\"{{ ras.formas }}\" as=\"f\" hint-placeholder-count=\"20\">\n                  <path d=\"{{ f.d }}\" fill=\"{{ f.cor }}\" stroke=\"#1d1f20\" stroke-width=\"{{ ras.traco }}\" stroke-opacity=\"0.35\" sc-camel-on-mouse-enter=\"{{ f.entrar }}\"><\u002Fpath>\n                <\u002Fsc-for>\n              <\u002Fsvg>\n              <div style=\"display:flex;align-items:center;gap:10px;margin-top:14px\">\n                <span style=\"font-size:11px;color:color-mix(in srgb, var(--color-text) 55%, transparent)\">{{ ras.min }}<\u002Fspan>\n                <i style=\"flex:1;height:9px;display:block;background:linear-gradient(90deg,var(--color-accent-100),var(--color-accent-900))\"><\u002Fi>\n                <span style=\"font-size:11px;color:color-mix(in srgb, var(--color-text) 55%, transparent)\">{{ ras.max }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div>\n              <sc-raw-table class=\"table\">\n                <sc-raw-thead><sc-raw-tr><sc-raw-th>Região Administrativa<\u002Fsc-raw-th><sc-raw-th style=\"text-align:right\">População<\u002Fsc-raw-th><sc-raw-th style=\"text-align:right\">hab./km²<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n                <sc-raw-tbody>\n                  <sc-for list=\"{{ ras.tabela }}\" as=\"r\" hint-placeholder-count=\"15\">\n                    <sc-raw-tr style=\"{{ r.estilo }}\"><sc-raw-td>{{ r.nome }}<\u002Fsc-raw-td><sc-raw-td class=\"vg-num\" style=\"text-align:right\">{{ r.pop }}<\u002Fsc-raw-td><sc-raw-td class=\"vg-num\" style=\"text-align:right\">{{ r.dens }}<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                  <\u002Fsc-for>\n                <\u002Fsc-raw-tbody>\n              <\u002Fsc-raw-table>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div class=\"blueprint\" style=\"margin-top:26px;padding:18px 22px;max-width:100ch\">\n            <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n            <h5 style=\"margin:0 0 6px;font-size:15px\">Por que este mapa não mostra casos de dengue<\u002Fh5>\n            <p style=\"margin:0;font-size:13px;line-height:1.55;color:color-mix(in srgb, var(--color-text) 72%, transparent)\">Não há fonte pública com série semanal de casos por Região Administrativa: o InfoDengue opera apenas no nível municipal, o painel de incidência da SES-DF não expõe dados de forma programática, o LIRAa é publicado como relatório fechado e os microdados do SINAN dependem do FTP do DATASUS. Repartir os casos do DF entre as RAs na proporção da população produziria um mapa apenas aparentemente informativo, que reproduziria o mapa populacional e esconderia a desigualdade intraurbana real. Obtida a série por RA junto à SES-DF, ela se acopla a esta malha pelo nome da região.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsection>\n      <\u002Fsc-if>\n\n      <footer style=\"margin-top:36px;padding-top:14px;border-top:1px solid var(--color-divider);font-size:11px;line-height:1.5;color:color-mix(in srgb, var(--color-text) 45%, transparent);max-width:100ch\">\n        Fontes: InfoDengue (Fiocruz/FGV) para casos e clima; IBGE para população e malha municipal. Ferramenta de apoio à vigilância — não substitui a análise da equipe de vigilância epidemiológica local nem orienta conduta clínica individual.\n      <\u002Ffooter>\n    <\u002Fmain>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900},&quot;paletaRisco&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;sinal&quot;,&quot;aco&quot;],&quot;default&quot;:&quot;sinal&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Mapa de risco&quot;},&quot;alturaExtrusao&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:5,&quot;max&quot;:60,&quot;step&quot;:1,&quot;default&quot;:10,&quot;unit&quot;:&quot;%&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Mapa de risco&quot;}}\">\nconst ORDEM = [\"baixo\", \"moderado\", \"alto\", \"muito alto\"];\nconst PALETAS = {\n  sinal: [\"#94bce3\", \"#597ea3\", \"#2c455d\", \"#a2402f\"],\n  aco: [\"#b5d9fd\", \"#749dc4\", \"#416180\", \"#1d2d3d\"]\n};\nconst PALETAS_TXT = {\n  sinal: [\"#597ea3\", \"#416180\", \"#1d2d3d\", \"#8f3626\"],\n  aco: [\"#749dc4\", \"#416180\", \"#2c455d\", \"#12202c\"]\n};\nconst COD_FOCO = 5300108;\nconst ABAS = [\n  [\"panorama\", \"Panorama de Brasília\"],\n  [\"mapa\", \"Mapa de risco 3D\"],\n  [\"serie\", \"Séries temporais\"],\n  [\"ranking\", \"Ranking e relatório\"],\n  [\"modelo\", \"Desempenho do modelo\"],\n  [\"ras\", \"Brasília por RA\"]\n];\nconst RAMPA_HEX = [\"#eef6ff\", \"#d6ebff\", \"#b5d9fd\", \"#94bce3\", \"#749dc4\", \"#597ea3\", \"#416180\", \"#2c455d\", \"#1d2d3d\"];\nconst RAMPA_NUM = [0xeef6ff, 0xd6ebff, 0xb5d9fd, 0x94bce3, 0x749dc4, 0x597ea3, 0x416180, 0x2c455d, 0x1d2d3d];\nconst K = { se: 0, data: 1, casos: 2, est: 3, min: 4, max: 5, inc: 6, canal: 7, pop: 8 };\n\nconst nf = (n, d) => (n == null || isNaN(n) ? \"—\" : Number(n).toLocaleString(\"pt-BR\", { minimumFractionDigits: d || 0, maximumFractionDigits: d || 0 }));\nconst pct = n => (n == null || isNaN(n) ? \"—\" : Math.round(n * 100) + \"%\");\nconst semanaRot = c => String(c % 100).padStart(2, \"0\") + \"/\" + Math.floor(c / 100);\n\nfunction criarOrbita(THREE, camera, dom) {\n  const o = {\n    target: new THREE.Vector3(), raio: 100, theta: 0.2, phi: 0.85,\n    minDistance: 1, maxDistance: 1e6, maxPolarAngle: Math.PI * 0.47\n  };\n  o.sync = () => {\n    const v = camera.position.clone().sub(o.target);\n    o.raio = v.length() || 1;\n    o.theta = Math.atan2(v.x, v.z);\n    o.phi = Math.acos(Math.max(-1, Math.min(1, v.y / o.raio)));\n  };\n  o.update = () => {\n    o.raio = Math.max(o.minDistance, Math.min(o.maxDistance, o.raio));\n    o.phi = Math.max(0.08, Math.min(o.maxPolarAngle, o.phi));\n    const s = Math.sin(o.phi);\n    camera.position.set(\n      o.target.x + o.raio * s * Math.sin(o.theta),\n      o.target.y + o.raio * Math.cos(o.phi),\n      o.target.z + o.raio * s * Math.cos(o.theta)\n    );\n    camera.lookAt(o.target);\n  };\n  let arrasta = false, ax = 0, ay = 0;\n  dom.style.touchAction = \"none\";\n  dom.addEventListener(\"pointerdown\", e => {\n    arrasta = true; ax = e.clientX; ay = e.clientY;\n    dom.style.cursor = \"grabbing\";\n    try { dom.setPointerCapture(e.pointerId); } catch (err) { }\n  });\n  const solta = () => { arrasta = false; dom.style.cursor = \"grab\"; };\n  dom.addEventListener(\"pointerup\", solta);\n  dom.addEventListener(\"pointercancel\", solta);\n  dom.addEventListener(\"pointermove\", e => {\n    if (!arrasta) return;\n    o.theta -= (e.clientX - ax) * 0.006;\n    o.phi -= (e.clientY - ay) * 0.006;\n    ax = e.clientX; ay = e.clientY;\n  });\n  dom.addEventListener(\"wheel\", e => {\n    e.preventDefault();\n    o.raio *= 1 + Math.sign(e.deltaY) * 0.09;\n  }, { passive: false });\n  dom.style.cursor = \"grab\";\n  return o;\n}\n\nfunction linha(pts) {\n  let d = \"\", pen = false;\n  for (const p of pts) {\n    if (p == null) { pen = false; continue; }\n    d += (pen ? \"L\" : \"M\") + p[0].toFixed(1) + \" \" + p[1].toFixed(1) + \" \";\n    pen = true;\n  }\n  return d.trim();\n}\nfunction eixoY(max, h, casas) {\n  const passos = 4, out = [];\n  for (let i = 0; i <= passos; i++) {\n    const v = (max / passos) * i, y = h - (v / max) * h;\n    out.push({ y: +y.toFixed(1), ty: +(y + 3).toFixed(1), rotulo: nf(v, casas || 0) });\n  }\n  return out;\n}\n\nclass Component extends DCLogic {\n  state = {\n    dados: null, aba: \"panorama\", semanaIndice: null, municipio: \"5300108\",\n    limiar: 50, sinalizar: true, janela: 156, selecionado: COD_FOCO,\n    hover: null, indicador: \"pop\", raHover: null,\n    nivelMapa: \"ras\", raSel: \"Plano Piloto\"\n  };\n\n  componentDidMount() {\n    const usar = dados => this.setState({ dados, semanaIndice: dados.semanas.length - 1 }, () => this.tentarMapa());\n    let tentativas = 0;\n    const buscar = () => {\n      if (window.VIGIA_DADOS) return usar(window.VIGIA_DADOS);\n      if (++tentativas > 60) {\n        return fetch(\"dados_vigia.json\").then(r => r.json()).then(usar).catch(e => console.error(\"base não carregou\", e));\n      }\n      setTimeout(buscar, 100);\n    };\n    buscar();\n  }\n  componentDidUpdate() {\n    if (this.tres && this.nivelMontado !== this.state.nivelMapa) this.desmontarMapa();\n    this.tentarMapa(); this.atualizarMapa();\n  }\n  componentWillUnmount() { this.desmontarMapa(); }\n\n  // ─────────────── mapa 3D ───────────────\n  refMapa = el => {\n    if (!el) { this.desmontarMapa(); this.host = null; return; }\n    this.host = el; this.tentarMapa();\n  };\n\n  tentarMapa() {\n    if (this.tres || !this.host || !this.state.dados || !window.THREE) return;\n    const THREE = window.THREE;\n    const d = this.state.dados;\n    const nivel = this.state.nivelMapa;\n    this.nivelMontado = nivel;\n    const itens = nivel === \"ras\"\n      ? d.ras.map(r => ({ id: r.ra_nome, rings: r.rings }))\n      : d.malha.map(m => ({ id: m.cod, rings: m.rings }));\n    const w = this.host.clientWidth || 800, h = this.host.clientHeight || 560;\n\n    const cena = new THREE.Scene();\n    const camera = new THREE.PerspectiveCamera(38, w / h, 0.1, 3000);\n    camera.position.set(0, 145, 150);\n    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });\n    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));\n    renderer.setSize(w, h);\n    this.host.appendChild(renderer.domElement);\n\n    cena.add(new THREE.HemisphereLight(0xffffff, 0xb7b7ba, 0.95));\n    const sol = new THREE.DirectionalLight(0xffffff, 0.55);\n    sol.position.set(-90, 160, 90); cena.add(sol);\n\n    const controles = criarOrbita(THREE, camera, renderer.domElement);\n\n    // projeção equirretangular local\n    let lo0 = 0, la0 = 0, n = 0;\n    itens.forEach(m => m.rings[0].forEach(p => { lo0 += p[0]; la0 += p[1]; n++; }));\n    lo0 /= n; la0 /= n;\n    const ESC = nivel === \"ras\" ? 5000 : 1100, cosl = Math.cos(la0 * Math.PI / 180);\n    const px = p => [(p[0] - lo0) * cosl * ESC / 100, -(p[1] - la0) * ESC / 100];\n\n    const blocos = [];\n    for (const m of itens) {\n      const forma = new THREE.Shape();\n      m.rings[0].forEach((p, i) => { const [x, y] = px(p); i ? forma.lineTo(x, y) : forma.moveTo(x, y); });\n      const geo = new THREE.ExtrudeGeometry(forma, { depth: 1, bevelEnabled: false });\n      geo.rotateX(-Math.PI / 2);\n      const mat = new THREE.MeshLambertMaterial({ color: 0x94bce3 });\n      const malha = new THREE.Mesh(geo, mat);\n      malha.userData.cod = m.id;\n      const arestas = new THREE.LineSegments(\n        new THREE.EdgesGeometry(geo, 25),\n        new THREE.LineBasicMaterial({ color: 0x1d2d3d, transparent: true, opacity: 0.55 })\n      );\n      malha.add(arestas);\n      cena.add(malha); blocos.push(malha);\n    }\n    // centraliza e enquadra\n    const caixa = new THREE.Box3().setFromObject(cena);\n    const c = caixa.getCenter(new THREE.Vector3());\n    const tam = caixa.getSize(new THREE.Vector3());\n    blocos.forEach(b => { b.position.x -= c.x; b.position.z -= c.z; });\n    const maior = Math.max(tam.x, tam.z);\n    const grade = new THREE.GridHelper(Math.ceil(maior * 1.9), 40, 0x9aa4ad, 0xd0d5da);\n    grade.material.opacity = 0.4; grade.material.transparent = true; grade.position.y = -0.5;\n    cena.add(grade);\n    camera.position.set(maior * 0.2, maior * 1.02, maior * 1.06);\n    controles.target.set(0, 0, 0);\n    controles.minDistance = maior * 0.12; controles.maxDistance = maior * 3;\n    controles.sync(); controles.update();\n\n    const raycaster = new THREE.Raycaster(), ponteiro = new THREE.Vector2();\n    let pos = { x: 0, y: 0 };\n    const onMove = e => {\n      const r = renderer.domElement.getBoundingClientRect();\n      ponteiro.x = ((e.clientX - r.left) / r.width) * 2 - 1;\n      ponteiro.y = -((e.clientY - r.top) / r.height) * 2 + 1;\n      pos = { x: e.clientX - r.left, y: e.clientY - r.top };\n      raycaster.setFromCamera(ponteiro, camera);\n      const hit = raycaster.intersectObjects(blocos, false)[0];\n      const cod = hit ? hit.object.userData.cod : null;\n      if (cod !== (this.state.hover && this.state.hover.cod) || (cod && this.state.hover && (this.state.hover.x !== pos.x)))\n        this.setState({ hover: cod ? { cod, x: pos.x, y: pos.y } : null });\n    };\n    const onLeave = () => this.setState({ hover: null });\n    const onClick = () => {\n      if (!this.state.hover) return;\n      this.setState(nivel === \"ras\" ? { raSel: this.state.hover.cod } : { selecionado: this.state.hover.cod });\n    };\n    renderer.domElement.addEventListener(\"pointermove\", onMove);\n    renderer.domElement.addEventListener(\"pointerleave\", onLeave);\n    renderer.domElement.addEventListener(\"click\", onClick);\n\n    const ro = new ResizeObserver(() => {\n      if (!this.host) return;\n      const W = this.host.clientWidth, H = this.host.clientHeight;\n      if (!W || !H) return;\n      camera.aspect = W / H; camera.updateProjectionMatrix(); renderer.setSize(W, H);\n    });\n    ro.observe(this.host);\n\n    let vivo = true;\n    const laco = () => { if (!vivo) return; controles.update(); renderer.render(cena, camera); this.raf = requestAnimationFrame(laco); };\n    laco();\n\n    this.tres = { renderer, blocos, ro, maior, camera, controles, parar: () => { vivo = false; }, onMove, onLeave, onClick };\n    this.mapaChave = null;\n    this.atualizarMapa();\n  }\n\n  zoom = f => {\n    const t = this.tres; if (!t) return;\n    t.controles.raio *= f; t.controles.update();\n  };\n  enquadrar = () => {\n    const t = this.tres; if (!t) return;\n    t.controles.target.set(0, 0, 0);\n    t.camera.position.set(t.maior * 0.2, t.maior * 1.02, t.maior * 1.06);\n    t.controles.sync(); t.controles.update();\n  };\n\n  atualizarMapa() {\n    if (!this.tres || !this.state.dados) return;\n    if (this.nivelMontado === \"ras\") return this.atualizarRas();\n    const linhas = this.semana();\n    const paleta = PALETAS[this.props.paletaRisco || \"sinal\"];\n    const alturaMax = this.tres.maior * (this.props.alturaExtrusao || 22) / 100;\n    const chave = this.state.semanaIndice + \"|\" + this.state.selecionado + \"|\" + paleta[0] + \"|\" + alturaMax;\n    if (chave === this.mapaChave) return;\n    this.mapaChave = chave;\n    const porCod = {}; linhas.forEach(l => porCod[l.cod_ibge] = l);\n    const maxInc = Math.max(12, ...linhas.map(l => l.incidencia_100k || 0));\n    for (const b of this.tres.blocos) {\n      const l = porCod[b.userData.cod];\n      const alt = l ? Math.max(0.6, (l.incidencia_100k || 0) / maxInc * alturaMax) : 0.6;\n      b.scale.y = alt;\n      b.material.color.set(paleta[l ? l.risco_codigo : 0]);\n      const sel = b.userData.cod === this.state.selecionado;\n      b.children[0].material.color.set(sel ? 0x5980a6 : 0x1d2d3d);\n      b.children[0].material.opacity = sel ? 1 : 0.5;\n    }\n  }\n\n  atualizarRas() {\n    const st = this.state, campo = st.indicador === \"dens\" ? \"densidade_hab_km2\" : \"populacao\";\n    const alturaMax = this.tres.maior * (this.props.alturaExtrusao || 22) / 100;\n    const chave = \"ras|\" + campo + \"|\" + st.raSel + \"|\" + alturaMax.toFixed(2);\n    if (chave === this.mapaChave) return;\n    this.mapaChave = chave;\n    const vals = {};\n    st.dados.ras.forEach(r => vals[r.ra_nome] = r[campo] || 0);\n    const mx = Math.max(...Object.values(vals)) || 1;\n    for (const b of this.tres.blocos) {\n      const v = vals[b.userData.cod] || 0;\n      b.scale.y = Math.max(0.5, v / mx * alturaMax);\n      b.material.color.set(RAMPA_NUM[Math.min(8, Math.floor(v / mx * 8.99))]);\n      const sel = b.userData.cod === st.raSel;\n      b.children[0].material.color.set(sel ? 0x5980a6 : 0x1d2d3d);\n      b.children[0].material.opacity = sel ? 1 : 0.4;\n    }\n  }\n\n  desmontarMapa() {\n    if (!this.tres) return;\n    this.tres.parar(); cancelAnimationFrame(this.raf); this.tres.ro.disconnect();\n    const el = this.tres.renderer.domElement;\n    el.removeEventListener(\"pointermove\", this.tres.onMove);\n    el.removeEventListener(\"pointerleave\", this.tres.onLeave);\n    el.removeEventListener(\"click\", this.tres.onClick);\n    this.tres.renderer.dispose(); el.remove(); this.tres = null;\n  }\n\n  // ─────────────── seletores ───────────────\n  semana() {\n    const d = this.state.dados;\n    return d.snapshots[d.semanas[this.state.semanaIndice]] || [];\n  }\n  codSemana() { return this.state.dados.semanas[this.state.semanaIndice]; }\n\n  agrega \"entorno\", get: p => p[7] }\n    ], 1);\n\n    // 04 ranking\n    const ord = linhas.slice().sort((a, b) => b.probabilidade_alerta - a.probabilidade_alerta);\n    const posBsb = ord.findIndex(l => l.cod_ibge === COD_FOCO) + 1;\n    base.posicaoBsb = \"Brasília ocupa a posição \" + posBsb + \" de \" + ord.length + \" no ranking de probabilidade de alerta desta semana. \" +\n      ord.filter(l => l.probabilidade_alerta >= limiar).length + \" municípios acima do limiar de \" + st.limiar + \"%.\";\n    base.ranking = ord.map((l, i) => ({\n      pos: i + 1, nome: l.municipio, uf: l.uf, casos: nf(l.casos), est: nf(l.casos_est),\n      inc: nf(l.incidencia_100k, 1), risco: l.risco, prob: pct(l.probabilidade_alerta),\n      fatores: l.fatores_alerta, peso: l.cod_ibge === COD_FOCO ? \"700\" : \"400\",\n      corFundo: l.risco_codigo >= 2 ? paleta[l.risco_codigo] : \"var(--color-accent-100)\",\n      corTexto: l.risco_codigo >= 2 ? \"#f2f2f3\" : \"var(--color-accent-800)\",\n      estilo: l.cod_ibge === COD_FOCO ? \"background:var(--color-accent-100)\" : (st.sinalizar && l.dado_provisorio === 1 ? \"opacity:0.72\" : \"\")\n    }));\n\n    // 05 modelo\n    const nomes = { referencia: \"Referência (persistência)\", interpretavel: \"Interpretável (logística)\", aprendizado: \"Aprendizado (LightGBM)\" };\n    const campos = [\"sensibilidade\", \"especificidade\", \"vpp\", \"auc\", \"auprc\", \"brier\"];\n    const porModelo = {};\n    d.desempenho.forEach(r => { (porModelo[r.modelo] = porModelo[r.modelo] || []).push(r); });\n    const medias = Object.keys(porModelo).map(m => {\n      const rs = porModelo[m], o = { modelo: nomes[m] || m, chave: m };\n      campos.forEach(c => o[c] = rs.reduce((s, r) => s + r[c], 0) / rs.length);\n      return o;\n    });\n    const melhor = {};\n    campos.forEach(c => { melhor[c] = medias.reduce((a, b) => (c === \"brier\" ? b[c] < a[c] : b[c] > a[c]) ? b : a).chave; });\n    base.medias = medias.map(m => ({\n      modelo: m.modelo, peso: m.chave === \"aprendizado\" ? \"700\" : \"400\",\n      cels: campos.map(c => ({\n        v: m[c].toFixed(3).replace(\".\", \",\"),\n        cor: melhor[c] === m.chave ? \"var(--color-accent-800)\" : \"var(--color-text)\",\n        peso: melhor[c] === m.chave ? \"700\" : \"400\"\n      }))\n    }));\n    const anos = [...new Set(d.desempenho.map(r => r.ano))].sort();\n    const W = 600, Hh = 250, yMin = 0.65, yMax = 0.9;\n    base.auc = {\n      grade: [0, 1, 2, 3, 4].map(i => {\n        const v = yMin + (yMax - yMin) * i / 4, y = Hh - (v - yMin) / (yMax - yMin) * Hh;\n        return { y: +y.toFixed(1), ty: +(y + 3).toFixed(1), rotulo: v.toFixed(2).replace(\".\", \",\") };\n      }),\n      rotulosX: anos.map((a, i) => ({ x: +((i / (anos.length - 1)) * W).toFixed(1), rotulo: String(a) })),\n      linhas: [\"referencia\", \"interpretavel\", \"aprendizado\"].map((m, k) => ({\n        nome: nomes[m],\n        cor: [\"#b7b7ba\", \"#749dc4\", \"#1d2d3d\"][k],\n        largura: m === \"aprendizado\" ? 2.4 : 1.5,\n        traco: m === \"referencia\" ? \"4 3\" : \"0\",\n        d: linha(anos.map((a, i) => {\n          const r = d.desempenho.find(x => x.ano === a && x.modelo === m);\n          return r ? [(i / (anos.length - 1)) * W, Hh - (r.auc - yMin) / (yMax - yMin) * Hh] : null;\n        }))\n      }))\n    };\n    const maxPeso = d.importancia[0].peso;\n    base.importancia = d.importancia.map(v => ({\n      nome: v.variavel, pct: v.peso.toFixed(1).replace(\".\", \",\") + \"%\",\n      barra: Math.round(v.peso / maxPeso * 100) + \"%\"\n    }));\n\n    // 06 RAs\n    const campoRa = st.indicador === \"dens\" ? \"densidade_hab_km2\" : \"populacao\";\n    base.indicadores = [[\"pop\", \"População\"], [\"dens\", \"Densidade\"]].map(([v, r]) => ({\n      rotulo: r, ativo: st.indicador === v, ir: () => this.setState({ indicador: v })\n    }));\n    let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;\n    d.ras.forEach(r => r.rings[0].forEach(p => { x0 = Math.min(x0, p[0]); x1 = Math.max(x1, p[0]); y0 = Math.min(y0, p[1]); y1 = Math.max(y1, p[1]); }));\n    const S = 1000 / (x1 - x0);\n    const vals = d.ras.map(r => r[campoRa] || 0);\n    const vMax = Math.max(...vals), vMin = Math.min(...vals);\n    const rampa = [\"#eef6ff\", \"#d6ebff\", \"#b5d9fd\", \"#94bce3\", \"#749dc4\", \"#597ea3\", \"#416180\", \"#2c455d\", \"#1d2d3d\"];\n    base.ras = {\n      viewBox: \"0 0 1000 \" + Math.round((y1 - y0) * S),\n      traco: (1.2 / S * 1).toFixed(2) * 1 > 0 ? 1.4 : 1.4,\n      min: st.indicador === \"dens\" ? nf(vMin) + \" hab./km²\" : nf(vMin) + \" hab.\",\n      max: st.indicador === \"dens\" ? nf(vMax) + \" hab./km²\" : nf(vMax) + \" hab.\",\n      formas: d.ras.map(r => ({\n        d: \"M\" + r.rings[0].map(p => ((p[0] - x0) * S).toFixed(1) + \" \" + ((y1 - p[1]) * S).toFixed(1)).join(\"L\") + \"Z\",\n        cor: rampa[Math.min(8, Math.floor(((r[campoRa] || 0) - vMin) / (vMax - vMin || 1) * 8.99))],\n        entrar: () => this.setState({ raHover: r.ra_nome })\n      })),\n      tabela: d.ras.slice().sort((a, b) => (b[campoRa] || 0) - (a[campoRa] || 0)).map(r => ({\n        nome: r.ra_nome, pop: nf(r.populacao), dens: nf(r.densidade_hab_km2, 0),\n        estilo: st.raHover === r.ra_nome ? \"background:var(--color-accent-100)\" : \"\"\n      }))\n    };\n\n    return base;\n  }\n}\nfunction s_data(p) { return p[1]; }\nfunction s_se(p) { return p[0]; }\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
